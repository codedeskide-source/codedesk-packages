name: Build native Android APK
on:
  workflow_dispatch:
  push:
    branches: ["feathercast-native-apk"]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install platform and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile installable debug APK
        run: |
          cd feathercast_native
          python -m pip install pillow
          python generate_assets.py
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FeatherCast-Ninja-Android-v0.6-APK
          path: feathercast_native/app/build/outputs/apk/debug/app-debug.apk