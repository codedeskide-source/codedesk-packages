name: Build StoryTTS APK
on:
  push:
    branches:
      - storytts-reader-build-20261001
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat build_payload/storytts.part* | base64 --decode > /tmp/storytts.zip
          unzip -q /tmp/storytts.zip -d .

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle -p EpubTTSReader --no-daemon assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: StoryTTSReader-apk
          path: EpubTTSReader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
